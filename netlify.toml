[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_VERSION = "11"
  # These values are public SMTP routing metadata that intentionally appear in
  # source/docs. Keep credential scanning enabled for KARV_SMTP_PASSWORD.
  SECRETS_SCAN_OMIT_KEYS = "KARV_SMTP_HOST,KARV_SMTP_PORT,KARV_SMTP_SECURE,KARV_SMTP_USER,KARV_PROPOSAL_FROM_EMAIL,KARV_PROPOSAL_FROM_NAME,KARV_PROPOSAL_RECIPIENT_EMAIL"

[context.deploy-preview]
  command = "npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "xr-spatial-tracking=(self)"

[[headers]]
  for = "/assets/geometry/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/moldes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
