name: F11 one-shot WebP conversion

on:
  push:
    branches: [feat/f11-custom-proposals]

permissions:
  contents: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/f11-custom-proposals
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install deterministic image converter
        run: python -m pip install Pillow==11.3.0
      - name: Generate approved WebP runtime assets
        run: python scripts/convert-f11-assets.py
      - name: Commit generated assets and remove one-shot sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/proposals/sid-tattoo-p4 docs/f11/sid-tattoo-p4-assets.json
          git rm -r .f11-source scripts/convert-f11-assets.py .github/workflows/f11-convert.yml
          git commit -m "assets(f11): generate approved WebP proposal textures"
          git push origin HEAD:feat/f11-custom-proposals
