name: Format F4 candidate

on:
  push:
    branches:
      - agent/f4-pbr-runtime

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/f4-pbr-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format F4 files
        run: |
          npx prettier --write \
            src/3d/model-viewer-adapter.ts \
            src/3d/pbr-material-controller.ts \
            src/materials/pbr-material.test.ts \
            src/materials/pbr-material.ts \
            src/materials/public-catalog.ts \
            tests/e2e/pbr.spec.ts
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/3d/model-viewer-adapter.ts src/3d/pbr-material-controller.ts src/materials/pbr-material.test.ts src/materials/pbr-material.ts src/materials/public-catalog.ts tests/e2e/pbr.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m 'style(f4): apply project Prettier'
          git push origin HEAD:agent/f4-pbr-runtime
