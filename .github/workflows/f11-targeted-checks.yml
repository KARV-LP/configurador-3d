name: F11 targeted neutral and art checks v5

on:
  push:
    branches: [feat/f11-custom-proposals]
    paths:
      - .github/workflows/f11-targeted-checks.yml

permissions:
  contents: write

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: npx prettier src/app/App.tsx src/3d/core-3d-controller.ts src/3d/pbr-material-controller.ts src/3d/pbr-material-controller.test.ts src/proposals/custom-proposal-coordinator.test.ts src/proposals/f11-visual-review.ts src/proposals/local-pdf-art.ts src/ui/CustomArtPanel.tsx src/ui/MaterialLibraryPanel.tsx src/styles.css tests/e2e/custom-art.spec.ts tests/e2e/f11-visual-review.spec.ts tests/e2e/initial-loading.spec.ts tests/e2e/library.spec.ts --write
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "style: format neutral and Sua ARTE implementation"
          git push
      - run: npm run lint
      - run: npx vitest run src/3d/pbr-material-controller.test.ts src/proposals/custom-proposal-coordinator.test.ts src/proposals/pdf-uv-profile.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/initial-loading.spec.ts tests/e2e/library.spec.ts tests/e2e/custom-art.spec.ts tests/e2e/smoke.spec.ts
