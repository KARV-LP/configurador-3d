name: F8 Temporary Audit

on:
  push:
    branches: [agent/f8-quality-gate]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit details
        run: npm audit --json || true
