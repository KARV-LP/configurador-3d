name: F8 Temporary Audit

on:
  push:
    branches: [agent/f8-qa-ci-security-performance]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --json || true
      - name: Audit all dependencies
        run: npm audit --json || true
