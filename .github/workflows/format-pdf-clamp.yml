name: Format canonical PDF clamp

on:
  push:
    branches: [feat/f11-custom-proposals]
    paths:
      - .github/workflows/format-pdf-clamp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier src/proposals/pdf-uv-profile.ts src/proposals/pdf-uv-profile.test.ts src/proposals/custom-proposal-coordinator.ts docs/F11-CUSTOM-PROPOSALS.md docs/F11-PDF-SOURCE-AUDIT.md docs/f11/canonical-pdf-uv-profiles.json --write
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/proposals/pdf-uv-profile.ts src/proposals/pdf-uv-profile.test.ts src/proposals/custom-proposal-coordinator.ts docs/F11-CUSTOM-PROPOSALS.md docs/F11-PDF-SOURCE-AUDIT.md docs/f11/canonical-pdf-uv-profiles.json
          git commit -m "style: format canonical PDF clamp profiles"
          git push
