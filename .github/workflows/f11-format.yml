name: F11 one-shot formatting

on:
  push:
    branches: [feat/f11-custom-proposals]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/f11-custom-proposals
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatted integration and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git rm .github/workflows/f11-format.yml
          git commit -m "style(f11): format hybrid integration"
          git push origin HEAD:feat/f11-custom-proposals
