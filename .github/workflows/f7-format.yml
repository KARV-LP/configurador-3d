name: F7 Temporary Format
on:
  push:
    branches:
      - agent/f7-persistent-state
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/f7-persistent-state
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier src/app/App.tsx src/configurator/config-serializer.test.ts src/configurator/config-serializer.ts src/configurator/configuration-session.test.ts src/configurator/configuration-session.ts src/ui/ConfigurationSummary.tsx tests/e2e/persistence.spec.ts --write
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/App.tsx src/configurator/config-serializer.test.ts src/configurator/config-serializer.ts src/configurator/configuration-session.test.ts src/configurator/configuration-session.ts src/ui/ConfigurationSummary.tsx tests/e2e/persistence.spec.ts
          git diff --cached --quiet || git commit -m "style(f7): prettier"
          git push origin HEAD:agent/f7-persistent-state
