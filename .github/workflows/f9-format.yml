name: F9 Temporary Format

on:
  push:
    branches: [agent/f9-device-gate]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/f9-device-gate
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier docs/F9-DEVICE-GATE.md --write
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/F9-DEVICE-GATE.md
          git commit -m "style(f9): format device gate protocol"
          git push origin HEAD:agent/f9-device-gate
