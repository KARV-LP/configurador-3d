name: Patch audited Vite

on:
  push:
    branches: [feat/f11-custom-proposals]
    paths:
      - .github/workflows/patch-vite-audit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install --save-dev vite@8.3.4
      - name: Commit audited dependency
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(deps): patch Vite security advisory"
          git push
