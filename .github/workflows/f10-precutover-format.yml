name: F10 Temporary Prettier

on:
  push:
    branches: [fix/f10-orbit-surface-bar]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/f10-orbit-surface-bar
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier src/3d/ChairViewer.tsx --write
      - name: Commit formatted file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/3d/ChairViewer.tsx
          git diff --cached --quiet && exit 0
          git commit -m "style(f10): format pre-cutover viewer"
          git push origin HEAD:fix/f10-orbit-surface-bar
