name: Validar Configurador 3D

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Guard
        run: npm run guard

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit and contract tests
        run: npm test

      - name: Build and budgets
        run: npm run build

      - name: E2E smoke
        run: npm run e2e
