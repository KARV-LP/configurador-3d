name: Format F11 loading

on:
  push:
    branches: [feat/f11-custom-proposals]
    paths:
      - src/app/App.tsx
      - src/styles.css
      - tests/e2e/initial-loading.spec.ts
      - .github/workflows/format-f11-loading.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier src/app/App.tsx src/styles.css tests/e2e/initial-loading.spec.ts --write
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx src/styles.css tests/e2e/initial-loading.spec.ts
          git commit -m "style: format initial loading implementation"
          git push
