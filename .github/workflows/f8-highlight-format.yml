name: F8 Highlight Fix Format

on:
  push:
    branches: [agent/f8-quality-gate]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/f8-quality-gate
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier src/3d/model-viewer-adapter.ts src/3d/material-controller.ts src/3d/material-controller.test.ts src/3d/core-3d-controller.test.ts --write
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/3d/model-viewer-adapter.ts src/3d/material-controller.ts src/3d/material-controller.test.ts src/3d/core-3d-controller.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(f8): format highlight isolation fix"
          git push origin HEAD:agent/f8-quality-gate
