name: F1 Apply Format

on:
  push:
    branches:
      - agent/f1-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/f1-foundation

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply Prettier
        run: npm run format

      - name: Commit formatting when changed
        run: |
          if git diff --quiet; then
            echo "Formatting already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests index.html scripts .github/workflows/ci.yml
          git commit -m "style(f1): apply prettier"
          git push
