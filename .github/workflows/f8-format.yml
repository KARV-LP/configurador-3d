name: F8 Temporary Format

on:
  push:
    branches: [agent/f8-qa-ci-security-performance]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/f8-qa-ci-security-performance
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier docs/F8-QA-GATE.md tests/e2e/f8-release-gate.spec.ts --write
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/F8-QA-GATE.md tests/e2e/f8-release-gate.spec.ts
          git commit -m "style(f8): format release gate"
          git push origin HEAD:agent/f8-qa-ci-security-performance
