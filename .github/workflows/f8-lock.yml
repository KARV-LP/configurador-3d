name: F8 Temporary Lockfile

on:
  push:
    branches: [agent/f8-qa-ci-security-performance]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/f8-qa-ci-security-performance
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only
      - run: npm audit --audit-level=moderate
      - name: Commit lockfile
        run: |
          if git diff --quiet package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(f8): refresh lockfile"
          git push origin HEAD:agent/f8-qa-ci-security-performance
